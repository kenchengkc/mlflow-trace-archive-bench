name: PostgreSQL benchmark
on:
  push:
    paths:
      - '**.py'
      - 'sql/**'
      - '.github/workflows/postgres.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      full_study:
        description: Run the 100k workload matrix and million-trace checks
        type: boolean
        default: false
      jit_control:
        description: Repeat the million-trace bounded query with JIT on and off
        type: boolean
        default: false
      driver_study:
        description: Run the MLflow finder and raw SQL on three migrated queues
        type: boolean
        default: false
      two_step_study:
        description: Compare the MLflow finder, bounded probe and two-step selector
        type: boolean
        default: false
      chunk_study:
        description: Measure the MLflow finder at the 1,000-experiment chunk boundary
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  postgres16:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use PostgreSQL 16
        run: echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Check eligibility, ordering, and changes between batches
        run: python3 -m unittest -v
      - name: Check the strategy runner and report
        run: |
          python3 study.py --rows 512 --archived-pct 0 100 --batch-size 3 --samples 2 --jit-control --output smoke.json.gz
          python3 summarize.py smoke.json.gz --with-planning --buffers
      - name: Run the original index comparison
        run: python3 benchmark.py --output benchmark-result.json
      - name: Compare two matched 95%-archived queues
        run: python3 matched_queues.py --output matched-queues.json.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres16-results
          path: |
            benchmark-result.json
            matched-queues.json.gz
          if-no-files-found: error
  driver-study:
    if: github.event_name == 'workflow_dispatch' && (inputs.driver_study || inputs.two_step_study || inputs.chunk_study)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MLFLOW_DISABLE_AGENT_HINT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Install the pinned tracking store and database driver
        run: |
          python3 -m venv "$RUNNER_TEMP/driver-env"
          "$RUNNER_TEMP/driver-env/bin/python" -m pip install -r requirements-driver.txt
          echo "$RUNNER_TEMP/driver-env/bin" >> "$GITHUB_PATH"
      - name: Check the migrated fixtures and concurrent writes
        if: inputs.driver_study || inputs.two_step_study
        run: python -m unittest -v test_driver_fixture test_two_step
      - name: Check the tied batch across the experiment chunk boundary
        if: inputs.chunk_study
        run: python -m unittest -v test_chunk_study
      - name: Measure MLflow with 1,000 and 1,001 experiments
        if: inputs.chunk_study
        run: python chunk_study.py --output chunk-study.json.gz >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.chunk_study
        with:
          name: chunk-study
          path: chunk-study.json.gz
          if-no-files-found: error
      - name: Measure the three queues
        if: inputs.driver_study
        run: python driver_study.py --output driver-study.json.gz >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.driver_study
        with:
          name: driver-study
          path: driver-study.json.gz
          if-no-files-found: error
      - name: Measure two-step selection across all experiments and the rare experiment
        if: inputs.two_step_study
        run: |
          python two_step_study.py --output two-step.json.gz >> "$GITHUB_STEP_SUMMARY"
          python two_step_study.py --scope 8 --output two-step-rare.json.gz >> "$GITHUB_STEP_SUMMARY"
      - name: Repeat the million-trace fresh-queue compilation case
        if: inputs.two_step_study
        run: python two_step_study.py --rows 1000000 --fresh-only --output two-step-million-fresh.json.gz >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.two_step_study
        with:
          name: two-step
          path: |
            two-step.json.gz
            two-step-rare.json.gz
            two-step-million-fresh.json.gz
          if-no-files-found: error
  study:
    if: github.event_name == 'workflow_dispatch' && inputs.full_study
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: matrix, rows: 100000, pct: '0 50 95 99 100', scopes: '1 8 1,2,3,4,5,6,7,8', batches: '3 100 1000' }
          - { name: million-start, rows: 1000000, pct: '0', scopes: '1,2,3,4,5,6,7,8', batches: '100' }
          - { name: million-late, rows: 1000000, pct: '95', scopes: '1,2,3,4,5,6,7,8', batches: '100' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Compare the queries in all six execution orders
        run: >
          python3 study.py --rows ${{ matrix.rows }} --archived-pct ${{ matrix.pct }}
          --scope ${{ matrix.scopes }} --batch-size ${{ matrix.batches }}
          --samples 6 --output ${{ matrix.name }}.json.gz
      - run: python3 summarize.py ${{ matrix.name }}.json.gz --with-planning >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-${{ matrix.name }}
          path: ${{ matrix.name }}.json.gz
          if-no-files-found: error
  jit-control:
    if: github.event_name == 'workflow_dispatch' && inputs.jit_control
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Alternate JIT on and off on the same fixture
        run: >
          python3 study.py --rows 1000000 --archived-pct 0 95 --scope 1,2,3,4,5,6,7,8
          --batch-size 100 --samples 6 --jit-control --output million-jit.json.gz
      - run: python3 summarize.py million-jit.json.gz --with-planning >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-million-jit
          path: million-jit.json.gz
          if-no-files-found: error
